<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unify — Bannière</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #111;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }

    input, textarea {
      width: 100%;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 14px;
      font-family: inherit;
      color: #111;
      outline: none;
      transition: border-color 0.15s;
      resize: none;
    }

    input:focus, textarea:focus { border-color: #111; }

    .field { margin-bottom: 16px; }

    .sep {
      border: none;
      border-top: 1px solid #f0f0f0;
      margin: 24px 0;
    }

    button {
      width: 100%;
      background: #111;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    button:hover { opacity: 0.8; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .status {
      margin-top: 14px;
      font-size: 13px;
      text-align: center;
      min-height: 20px;
    }

    .status.ok  { color: #22a06b; }
    .status.err { color: #e03131; }

    .token-hint {
      font-size: 12px;
      color: #999;
      margin-top: 4px;
    }

    .reset-token {
      background: none;
      color: #999;
      font-size: 12px;
      padding: 0;
      margin-top: 20px;
      text-decoration: underline;
      cursor: pointer;
      width: auto;
    }

    .reset-token:hover { opacity: 0.7; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Unify — Bannière</h1>

    <div id="token-section">
      <div class="field">
        <label>GitHub Token (PAT)</label>
        <input type="password" id="token-input" placeholder="github_pat_…" autocomplete="off" />
        <p class="token-hint">Stocké dans votre navigateur, jamais envoyé ailleurs que GitHub.</p>
      </div>
      <button id="save-token-btn">Enregistrer le token</button>
    </div>

    <div id="form-section" style="display:none">
      <div class="field">
        <label>Titre</label>
        <input type="text" id="title" maxlength="80" />
      </div>
      <div class="field">
        <label>Description</label>
        <textarea id="description" rows="3" maxlength="200"></textarea>
      </div>
      <hr class="sep" />
      <button id="publish-btn">Publier</button>
      <p class="status" id="status"></p>
      <button class="reset-token" id="reset-token-btn">Changer de token</button>
    </div>
  </div>

  <script>
    const REPO  = 'Luc-Maitre/Unify';
    const FILE  = 'banner.json';
    const TOKEN_KEY = 'unify_banner_token';

    const $ = id => document.getElementById(id);

    function getToken() { return localStorage.getItem(TOKEN_KEY) || ''; }

    function showStatus(msg, type) {
      const el = $('status');
      el.textContent = msg;
      el.className = 'status ' + type;
    }

    async function loadCurrent(token) {
      const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE}`, {
        headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' }
      });
      if (!res.ok) throw new Error('Impossible de lire le fichier (token invalide ?)');
      return res.json();
    }

    async function publish(token, title, description, sha) {
      const content = btoa(unescape(encodeURIComponent(
        JSON.stringify({ title, description }, null, 2) + '\n'
      )));
      const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE}`, {
        method: 'PUT',
        headers: {
          Authorization: `Bearer ${token}`,
          Accept: 'application/vnd.github+json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ message: 'Update banner', content, sha })
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.message || 'Erreur lors de la publication');
      }
    }

    async function init() {
      const token = getToken();
      if (!token) return;

      $('token-section').style.display = 'none';
      $('form-section').style.display = 'block';
      showStatus('Chargement…', '');

      try {
        const file = await loadCurrent(token);
        const data = JSON.parse(decodeURIComponent(escape(atob(file.content.replace(/\n/g, '')))));
        $('title').value = data.title || '';
        $('description').value = data.description || '';
        showStatus('', '');
      } catch (e) {
        showStatus(e.message, 'err');
      }
    }

    $('save-token-btn').addEventListener('click', () => {
      const val = $('token-input').value.trim();
      if (!val) return;
      localStorage.setItem(TOKEN_KEY, val);
      init();
    });

    $('reset-token-btn').addEventListener('click', () => {
      localStorage.removeItem(TOKEN_KEY);
      $('token-section').style.display = 'block';
      $('form-section').style.display = 'none';
      $('token-input').value = '';
    });

    $('publish-btn').addEventListener('click', async () => {
      const token = getToken();
      const title = $('title').value.trim();
      const description = $('description').value.trim();

      if (!title || !description) {
        showStatus('Titre et description requis.', 'err');
        return;
      }

      $('publish-btn').disabled = true;
      showStatus('Publication…', '');

      try {
        const file = await loadCurrent(token);
        await publish(token, title, description, file.sha);
        showStatus('Publié ! Le plugin se mettra à jour dans quelques secondes.', 'ok');
      } catch (e) {
        showStatus(e.message, 'err');
      } finally {
        $('publish-btn').disabled = false;
      }
    });

    init();
  </script>
</body>
</html>
